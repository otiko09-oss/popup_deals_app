name: popup_deals_app
description: A production-ready Flutter app for food deals and marketplace.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^3.3.0
  cloud_firestore: ^6.7.1
  connectivity_plus: ^5.0.0
  equatable: ^2.0.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_storage: ^13.4.5
  flutter_animate: ^4.2.0
  flutter_riverpod: ^2.4.0
  flutter_screenutil: ^5.9.0
  flutter_slidable: ^3.0.0
  geolocator: ^9.0.0
  get_it: ^8.1.0
  go_router: ^12.0.0
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.0
  image_picker: ^0.8.7+5
  intl: ^0.20.2
  logger: ^2.1.0
  riverpod: any
  shared_preferences: ^2.2.0
  timeago: ^3.6.0
  uuid: ^4.0.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  image: ^4.8.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
